[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aklo-repro"
version = "0.1.0"
description = "Reproduction of Lifelong Online Learning from Accumulated Knowledge (AKLO/AKLOMS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "wandb>=0.17",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
